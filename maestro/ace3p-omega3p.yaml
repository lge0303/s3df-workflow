description:
  name: ace3p-omega3p-pipeline
  description: |
    Omega3P eigenmode simulation on S3DF via Slurm.
    Uses PillboxLossless test case (reference freq: 1.3138 GHz).
    Steps: omega3p-solve → verify-results

env:
  variables:
    ACE3P_BIN: /sdf/group/rfar/lge/sdf/ace3p/bin
    INPUT_FILE: PillboxLossless.omega3p
    MESH_FILE: PillboxLossless.ncdf
    DATA_DIR: $(SPECROOT)/data
    N_PROCS: 16
    ENV_SETUP: source /sdf/group/rfar/lge/sdf/env.sh

batch:
  type: slurm
  host: s3df
  bank: rfar:regular
  queue: milano
  qos: normal
  procs: 1

study:
  - name: omega3p-solve
    description: Run Omega3P eigenmode solver on pillbox cavity
    run:
      cmd: |
        $(ENV_SETUP)
        echo "=== Omega3P Eigenmode Solve ==="
        cp $(DATA_DIR)/$(INPUT_FILE) $(WORKSPACE)/
        cp $(DATA_DIR)/$(MESH_FILE) $(WORKSPACE)/
        cd $(WORKSPACE)
        srun --overlap --cpu-bind=none -n $(N_PROCS) $(ACE3P_BIN)/omega3p $(INPUT_FILE)
        echo "Solver complete"
        grep "Frequency:" omega3p.out
      nodes: 1
      procs: 16
      walltime: "00:10:00"

  - name: verify-results
    description: Verify eigenfrequencies match reference values
    run:
      cmd: |
        echo "=== Verification ==="
        cd $(omega3p-solve.workspace)
        echo "Output files:"
        ls -la *.out *.mod 2>/dev/null
        echo ""
        echo "Eigenfrequencies found:"
        grep "Frequency" omega3p.out 2>/dev/null || grep -i "freq\|eigen\|mode" *.out 2>/dev/null | head -20
        echo ""
        echo "Quality factors:"
        grep "QualityFactor" omega3p.out 2>/dev/null || true
        echo ""
        echo "Reference: Mode 1 = 1.3138 GHz, Q = 28877"
      depends: [omega3p-solve]
      nodes: 1
      procs: 1
      walltime: "00:05:00"
