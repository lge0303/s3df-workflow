description:
  name: ace3p-multi-solver
  description: |
    Multi-solver DAG: Omega3P eigenmode → Track3P particle tracking.
    Demonstrates cross-solver dependencies where Track3P uses
    mode fields computed by Omega3P as input for multipacting analysis.

env:
  variables:
    ACE3P_BIN: /sdf/group/rfar/lge/sdf/ace3p/build/bin
    DATA_DIR: $(SPECROOT)/data
    MESH_FILE: pillbox4.ncdf

batch:
  type: slurm
  host: s3df
  bank: rfar

study:
  - name: omega3p-solve
    description: Compute eigenmode fields (required by Track3P)
    run:
      cmd: |
        echo "Step 1: Computing eigenmodes with Omega3P"
        cp $(DATA_DIR)/pillbox.omega3p $(WORKSPACE)/
        ln -sf $(DATA_DIR)/$(MESH_FILE) $(WORKSPACE)/
        cd $(WORKSPACE)
        $(LAUNCHER) $(ACE3P_BIN)/omega3p pillbox.omega3p
        echo "Eigenmode computation complete"
        ls omega3p_results/
      nodes: 1
      procs: 128
      walltime: "00:30:00"

  - name: omega3p-postprocess
    description: Extract RF parameters from eigenmodes
    run:
      cmd: |
        echo "Step 2a: Post-processing eigenmodes"
        cp $(DATA_DIR)/pillbox.rfpost $(WORKSPACE)/
        ln -sf $(omega3p-solve.workspace)/omega3p_results $(WORKSPACE)/
        cd $(WORKSPACE)
        $(LAUNCHER) $(ACE3P_BIN)/acdtool postprocess rf pillbox.rfpost
        echo "RF post-processing complete"
      depends: [omega3p-solve]
      nodes: 1
      procs: 1
      walltime: "00:10:00"

  - name: track3p-solve
    description: Run multipacting simulation using Omega3P mode fields
    run:
      cmd: |
        echo "Step 2b: Running Track3P multipacting analysis"
        cp $(DATA_DIR)/pillbox.track3p $(WORKSPACE)/
        ln -sf $(DATA_DIR)/$(MESH_FILE) $(WORKSPACE)/
        ln -sf $(omega3p-solve.workspace)/omega3p_results $(WORKSPACE)/
        cd $(WORKSPACE)
        $(LAUNCHER) $(ACE3P_BIN)/track3p pillbox.track3p
        echo "Track3P simulation complete"
      depends: [omega3p-solve]
      nodes: 1
      procs: 128
      walltime: "01:00:00"

  - name: track3p-analysis
    description: Analyze multipacting impacts and trajectories
    run:
      cmd: |
        echo "Step 3: Analyzing Track3P results"
        cd $(track3p-solve.workspace)
        echo "Impact statistics:" > $(WORKSPACE)/analysis.txt
        if [ -d track3p_results ]; then
          ls track3p_results/ >> $(WORKSPACE)/analysis.txt
          echo "Track3P results found"
        else
          echo "No track3p_results directory found" >> $(WORKSPACE)/analysis.txt
        fi
        echo ""
        echo "=== Multi-Solver Pipeline Complete ==="
        echo "Omega3P results: $(omega3p-solve.workspace)/omega3p_results/"
        echo "RF parameters: $(omega3p-postprocess.workspace)/"
        echo "Track3P results: $(track3p-solve.workspace)/track3p_results/"
        echo "Analysis: $(WORKSPACE)/analysis.txt"
      depends: [track3p-solve]
