description:
  name: ace3p-multi-solver
  description: |
    Multi-solver DAG: Omega3P → Track3P on S3DF.
    Based on CW23 Pillbox multipacting example.
    Step 1: Omega3P computes eigenmode fields.
    Step 2: Track3P uses mode fields for multipacting simulation.
    Step 3: Summary of results.

env:
  variables:
    ACE3P_BIN: /sdf/group/rfar/lge/sdf/ace3p/bin
    DATA_DIR: $(SPECROOT)/data/cw23-pillbox
    ENV_SETUP: source /sdf/group/rfar/lge/sdf/env.sh

batch:
  type: slurm
  host: s3df
  bank: rfar:regular
  queue: milano
  qos: normal
  procs: 1

study:
  - name: omega3p-solve
    description: Compute eigenmode fields (required by Track3P)
    run:
      cmd: |
        $(ENV_SETUP)
        echo "=== Step 1: Omega3P Eigenmode Solve (CW23 Pillbox) ==="
        cp $(DATA_DIR)/Pillbox.ncdf $(WORKSPACE)/
        cp $(DATA_DIR)/Pillbox.omega3p $(WORKSPACE)/
        cd $(WORKSPACE)
        srun --overlap --cpu-bind=none -n 16 $(ACE3P_BIN)/omega3p Pillbox.omega3p
        echo "=== Omega3P Complete ==="
        echo "Mode files:"
        ls omega3p_results/*.mod 2>/dev/null
        grep "Frequency" omega3p_results/omega3p.out 2>/dev/null | grep -v "Shift" || true
      nodes: 1
      procs: 16
      walltime: "00:10:00"

  - name: track3p-solve
    description: Multipacting simulation using Omega3P mode fields
    run:
      cmd: |
        $(ENV_SETUP)
        echo "=== Step 2: Track3P Multipacting (CW23 Pillbox) ==="
        cp $(DATA_DIR)/Pillbox.ncdf $(WORKSPACE)/
        cp $(DATA_DIR)/Pillbox.track3p $(WORKSPACE)/
        cp $(DATA_DIR)/copper.dat $(WORKSPACE)/
        ln -sf $(omega3p-solve.workspace)/omega3p_results $(WORKSPACE)/omega3p_results
        cd $(WORKSPACE)
        echo "Mode files linked:"
        ls omega3p_results/*.mod
        echo "Starting Track3P (field scan 23-25 MV/m, hybrid MPI+OpenMP)..."
        export OMP_NUM_THREADS=16
        srun --overlap --cpu-bind=none -n 1 -c 16 $(ACE3P_BIN)/track3p Pillbox.track3p
        echo "=== Track3P Complete ==="
        if [ -d OUTPUT ]; then
          echo "Output files:"
          ls OUTPUT/
        fi
      depends: [omega3p-solve]
      nodes: 1
      procs: 16
      walltime: "00:20:00"

  - name: summary
    description: Summarize multi-solver pipeline results
    run:
      cmd: |
        echo "=============================================="
        echo "  Multi-Solver Pipeline: Omega3P → Track3P"
        echo "  CW23 Pillbox Multipacting Example"
        echo "=============================================="
        echo ""
        echo "Step 1 - Omega3P Eigenmode Results:"
        grep "Frequency:" $(omega3p-solve.workspace)/omega3p_results/omega3p.out 2>/dev/null || true
        grep "QualityFactor" $(omega3p-solve.workspace)/omega3p_results/omega3p.out 2>/dev/null || true
        echo ""
        echo "Step 2 - Track3P Multipacting Results:"
        T3P=$(track3p-solve.workspace)
        RESFILE="$T3P/track3p_results/OUTPUT/resonantparticles"
        ECFILE="$T3P/track3p_results/OUTPUT/enhancementCounter"
        if [ -f "$RESFILE" ]; then
          NLINES=$(wc -l < "$RESFILE")
          echo "  Resonant particles: $NLINES entries"
          echo "  Field levels scanned:"
          awk 'NR>1{print "    " $1 " V/m"}' "$RESFILE" | sort -u
          echo ""
          echo "  First 5 entries:"
          head -6 "$RESFILE"
        else
          echo "  No resonant particles file found"
          ls "$T3P/track3p_results/OUTPUT/" 2>/dev/null || echo "  No OUTPUT directory"
        fi
        if [ -f "$ECFILE" ]; then
          echo ""
          echo "  Enhancement counter (multipacting susceptibility):"
          head -5 "$ECFILE"
        fi
        echo ""
        echo "=== Pipeline Complete ==="
      depends: [track3p-solve]
      nodes: 1
      procs: 1
      walltime: "00:05:00"
