description:
  name: ace3p-multi-solver
  description: |
    Multi-solver DAG: Omega3P → Track3P on S3DF.
    Step 1: Omega3P computes eigenmode fields for a 10-degree pillbox slice.
    Step 2: Track3P uses those fields for multipacting particle simulation.
    Demonstrates cross-solver dependency in Maestro DAG.

env:
  variables:
    ACE3P_BIN: /sdf/group/rfar/lge/sdf/ace3p/bin
    DATA_DIR: $(SPECROOT)/data
    ENV_SETUP: source /sdf/group/rfar/lge/sdf/env.sh

batch:
  type: slurm
  host: s3df
  bank: rfar:regular
  queue: milano
  qos: normal
  procs: 1

study:
  - name: omega3p-solve
    description: Compute eigenmode fields (required by Track3P)
    run:
      cmd: |
        $(ENV_SETUP)
        echo "=== Step 1: Omega3P Eigenmode Solve ==="
        cp $(DATA_DIR)/PillboxLosslessTenDSlice.ncdf $(WORKSPACE)/
        cp $(DATA_DIR)/PillboxLosslessTenDSlice.omega3p $(WORKSPACE)/
        cd $(WORKSPACE)
        srun --overlap --cpu-bind=none $(ACE3P_BIN)/omega3p PillboxLosslessTenDSlice.omega3p
        echo "=== Omega3P Complete ==="
        echo "Mode files generated:"
        ls omega3p_results/*.mod 2>/dev/null || true
      nodes: 1
      procs: 16
      walltime: "00:10:00"

  - name: track3p-solve
    description: Multipacting simulation using Omega3P mode fields
    run:
      cmd: |
        $(ENV_SETUP)
        echo "=== Step 2: Track3P Multipacting ==="
        cp $(DATA_DIR)/PillboxLosslessTenDSlice.ncdf $(WORKSPACE)/
        cp $(DATA_DIR)/PillboxLosslessTenDSlice.track3p $(WORKSPACE)/
        ln -sf $(omega3p-solve.workspace)/omega3p_results $(WORKSPACE)/omega3p_results
        cd $(WORKSPACE)
        echo "omega3p_results linked from: $(omega3p-solve.workspace)/omega3p_results"
        ls omega3p_results/*.mod 2>/dev/null
        srun --overlap --cpu-bind=none -n 8 $(ACE3P_BIN)/track3p PillboxLosslessTenDSlice.track3p
        echo "=== Track3P Complete ==="
        if [ -f OUTPUT/resonantparticles ]; then
          echo "Resonant particles found:"
          head -5 OUTPUT/resonantparticles
        else
          echo "Output files:"
          ls OUTPUT/ 2>/dev/null || true
        fi
      depends: [omega3p-solve]
      nodes: 1
      procs: 16
      walltime: "00:20:00"

  - name: summary
    description: Summarize multi-solver pipeline results
    run:
      cmd: |
        echo "=== Multi-Solver Pipeline Summary ==="
        echo ""
        echo "Step 1 - Omega3P Eigenmode:"
        O3P_OUT=$(omega3p-solve.workspace)
        grep "Frequency:" "$O3P_OUT"/omega3p_results/omega3p.out 2>/dev/null || true
        echo ""
        echo "Step 2 - Track3P Multipacting:"
        T3P_OUT=$(track3p-solve.workspace)
        if [ -f "$T3P_OUT/OUTPUT/resonantparticles" ]; then
          NLINES=$(wc -l < "$T3P_OUT/OUTPUT/resonantparticles")
          echo "Resonant particles: $NLINES entries (multipacting detected)"
          echo "Field levels:"
          awk 'NR>1{print $1}' "$T3P_OUT/OUTPUT/resonantparticles" | sort -u
        else
          echo "No resonant particles file"
          ls "$T3P_OUT"/OUTPUT/ 2>/dev/null || ls "$T3P_OUT"/*.out 2>/dev/null | head -3
        fi
        echo ""
        echo "=== Pipeline Complete ==="
      depends: [track3p-solve]
      nodes: 1
      procs: 1
      walltime: "00:05:00"
